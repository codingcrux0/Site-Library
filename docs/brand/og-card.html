<!doctype html>
<meta charset="utf-8">
<!-- The link-preview card (1200x630). make-brand.mjs turns this into public/og-image.png. Colours are the site's own tokens (src/styles/global.css). -->
<style>
  * { box-sizing: border-box; }
  body { margin: 0; width: 1200px; height: 630px; background: #fff; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #0b0d10; position: relative; overflow: hidden; }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(to right, rgba(11,13,16,.06) 1px, transparent 1px), linear-gradient(to bottom, rgba(11,13,16,.06) 1px, transparent 1px); background-size: 54px 54px; -webkit-mask-image: radial-gradient(ellipse 70% 80% at 30% 40%, #000 20%, transparent 85%); }
  .wrap { position: absolute; left: 96px; right: 96px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; }
  .mark { width: 132px; height: 132px; }
  h1 { font-size: 104px; line-height: 1; letter-spacing: -.035em; margin: 44px 0 0; font-weight: 700; }
  p { font-size: 42px; line-height: 1.25; margin: 26px 0 0; color: #4b5260; letter-spacing: -.01em; }
  .chips { position: absolute; left: 96px; bottom: 64px; display: flex; gap: 14px; }
  .chips i { display: block; width: 64px; height: 14px; border-radius: 7px; }
</style>
<div class="grid"></div>
<div class="wrap">
  <svg class="mark" viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="#0b0d10"/><path d="M18 33.5l9.5 9.5L46 22" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <h1>Site Library</h1>
  <p>Useful websites, tested by hand.<br>Dated, scored, with the catch.</p>
</div>
<div class="chips"><i style="background:#e6eefc"></i><i style="background:#f4eee3"></i><i style="background:#e5efe7"></i><i style="background:#eeeaf7"></i></div>
